name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is what the hooks run on (macOS's /usr/bin/python3).
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: make test PYTHON=python
